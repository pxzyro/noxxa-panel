<!DOCTYPE html>
<html><head><title>NOXXA V4 - ULTIMATE PTERO</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0a0a12;color:#fff}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#6d28d9 0%,#0a0a12 60%)}
.card{background:#15151f;border:1px solid #2a2a3a;border-radius:20px;padding:30px;width:90%;max-width:400px}
.btn{background:linear-gradient(90deg,#7c3aed,#4f46e5);border:none;color:#fff;padding:12px 20px;border-radius:12px;width:100%;font-weight:700;cursor:pointer}
input,select{width:100%;background:#0a0a12;border:1px solid #2a2a3a;padding:12px;border-radius:10px;color:#fff;margin:8px 0}
.dashboard{display:none;min-height:100vh}
.sidebar{position:fixed;width:250px;height:100vh;background:#11111b;border-right:1px solid #2a2a3a;padding:20px}
.main{margin-left:250px;padding:30px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin:20px 0}
.stat div{background:#15151f;border:1px solid #2a2a3a;border-radius:15px;padding:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99}
.modal.active{display:flex}
.modal-box{background:#15151f;border:1px solid #3a3a5a;border-radius:20px;padding:25px;width:90%;max-width:500px}
.server-list{display:grid;gap:12px;margin-top:20px}
.server-item{background:#15151f;border:1px solid #2a2a3a;border-radius:12px;padding:15px;display:flex;justify-content:space-between;align-items:center}
.badge{background:#10b98122;color:#10b981;padding:4px 10px;border-radius:20px;font-size:12px}
</style></head><body>
<div id="loginPage" class="login-page"><div class="card"><h2>PANEL NOXXA V4</h2><p style="opacity:.6;margin:10px 0 20px">ULTIMATE PTERO EDITION</p><input id="user" placeholder="Username" value="admin"><input id="pass" type="password" placeholder="Password" value="noxxa123"><button class="btn" onclick="login()">MASUK KE PANEL 🚀</button></div></div>
<div id="dashboard" class="dashboard"><div class="sidebar"><h3 style="color:#7c3aed">PANEL NOXXA<br>V4 ULTIMATE</h3><br><div style="display:grid;gap:10px"><button onclick="showPage('dash')" class="btn">📊 Dashboard</button><button onclick="showPage('servers')" class="btn" style="background:#15151f">🖥️ Servers</button><button onclick="openCreate()" class="btn" style="background:#10b981">+ Create Panel</button><button onclick="logout()" style="background:transparent;border:none;color:#ef4444;margin-top:50px;cursor:pointer">🚪 Logout</button></div></div><div class="main"><div id="page-dash"><h1>Dashboard V4</h1><p style="opacity:.6">Welcome, Admin Noxxa - Pterodactyl Connected</p><div class="stat"><div><small>ACTIVE SERVERS</small><h2 id="countServer">0</h2></div><div><small>TOTAL USERS</small><h2>2,341</h2></div><div><small>NODE STATUS</small><h2 style="color:#10b981">● Online</h2></div></div><div id="serverList" class="server-list"></div></div><div id="page-servers" style="display:none"><h1>Servers</h1><div id="serverList2" class="server-list"></div></div></div></div>
<div id="createModal" class="modal"><div class="modal-box"><h3>Create New Pterodactyl Panel</h3><br><input id="serverName" placeholder="Server Name (contoh: Bot Noxxa 1)"><select id="ram"><option value="1GB">1GB RAM - Basic</option><option value="2GB">2GB RAM - Standard</option><option value="4GB" selected>4GB RAM - Pro</option><option value="8GB">8GB RAM - Ultimate</option></select><input id="userEmail" placeholder="Client Email"><button class="btn" onclick="createServer()">🚀 CREATE PANEL NOW</button><button onclick="closeCreate()" style="background:transparent;border:1px solid #2a2a3a;color:#fff;padding:10px;border-radius:10px;width:100%;margin-top:10px;cursor:pointer">Cancel</button></div></div>
<script>
let servers=JSON.parse(localStorage.getItem('noxxa_servers')||'[]');
function login(){if(user.value==='admin'&&pass.value==='noxxa123'){loginPage.style.display='none';dashboard.style.display='block';render()}else alert('Salah!')}
function logout(){dashboard.style.display='none';loginPage.style.display='flex'}
function showPage(p){document.getElementById('page-dash').style.display=p==='dash'?'block':'none';document.getElementById('page-servers').style.display=p==='servers'?'block':'none'}
function openCreate(){createModal.classList.add('active')}function closeCreate(){createModal.classList.remove('active')}
function createServer(){let name=serverName.value||'Server-'+Date.now();let r=ram.value;let email=userEmail.value||'client@noxxa.id';let s={id:Date.now(),name,ram:r,email,status:'Online',created:new Date().toLocaleString()};servers.push(s);localStorage.setItem('noxxa_servers',JSON.stringify(servers));closeCreate();render();alert('✅ PANEL BERHASIL DIBUAT!\\n\\nName: '+name+'\\nRAM: '+r+'\\nEmail: '+email);serverName.value='';userEmail.value=''}
function render(){countServer.textContent=servers.length;let html=servers.map(s=>`<div class="server-item"><div><b>${s.name}</b><br><small style="opacity:.6">${s.ram} | ${s.email}</small></div><div><span class="badge">● ${s.status}</span></div></div>`).join('')||'<p style="opacity:.5">Belum ada server, klik Create Panel</p>';serverList.innerHTML=html;serverList2.innerHTML=html}
render();
</script></body></html>
